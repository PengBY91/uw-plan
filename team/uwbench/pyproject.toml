[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uwbench"
version = "0.1.0"
description = "Team-local A/B adapters, metrics and CLI contract; not the PyPI package of the same name"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["uwbench*"]
